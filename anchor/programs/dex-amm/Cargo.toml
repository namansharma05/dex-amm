[package]
name = "dexter"
version = "0.1.0"
description = "A simple SOL dexter program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "dexter"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = {version = "0.32.1", features = ["init-if-needed"]}
anchor-spl = "0.32.1"
blake3 = "=1.8.2"

[dev-dependencies]
litesvm = "=0.7.1"
solana-sdk = "2.3"
